app:
  http:
    outbound:
      allowed-hosts: "github=api.github.com;nvd=services.nvd.nist.gov;epss=api.first.org;eol=endoflife.date;openai=api.openai.com;resend=api.resend.com;turnstile=challenges.cloudflare.com;kev=www.cisa.gov;jvn=jvndb.jvn.jp;euvd=euvdservices.enisa.europa.eu;csaf-microsoft=msrc.microsoft.com;csaf-redhat=security.access.redhat.com;csaf-cisa=www.cisa.gov;sbom-endpoint=example.com"
  scheduling:
    enabled: false
  schema-migration:
    # Legacy repository tests exercise the platform reset line. P0 migration/RLS
    # tests opt in explicitly through PostgresITSupport.
    enabled: false
    pre-jpa-default-tenant-enabled: true
  security:
    # Deterministic test-only AES-256 key; never used by a deployed profile.
    credential-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
