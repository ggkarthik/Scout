spring:
  config:
    import: optional:classpath:application-prod.yml

app:
  security:
    require-production-secrets: true
    allow-api-key-auth: false
    jwt:
      allow-hmac-in-production: true
  tenancy:
    allow-header-tenant-selection: false
    require-tenant-context: true
  entitlements:
    # Preprod (customer-validation) runs the corrected resolver in SHADOW: legacy is still enforced,
    # corrected results are computed, and mismatch telemetry is emitted. Flip to ENFORCE with a
    # canary allowlist only after >=7 days of clean/explained mismatches (see the Phase 0 runbook).
    mode: ${APP_ENTITLEMENTS_MODE:SHADOW}
