<title>AI Grid Security Command Center</title>
<style>
/* ============================= TOKENS ============================= */
:root{
  color-scheme: dark;
  --bg:#0A0E17;
  --bg-grid: rgba(255,255,255,0.025);
  --surface:#0F1420;
  --surface-2:#141B2B;
  --surface-3:#1B2436;
  --surface-4:#212B40;
  --border:#232C40;
  --border-soft:#1A222F;
  --text:#E7ECF6;
  --text-secondary:#9FADC7;
  --text-muted:#65708C;
  --text-faint:#3D4560;

  --accent:#3987E5;       /* cyber blue - brand / interactive */
  --accent-strong:#5CA2F2;
  --accent-soft:rgba(57,135,229,0.14);
  --accent-2:#9085E9;      /* violet - AI / agent entity */
  --accent-2-soft:rgba(144,133,233,0.16);
  --brand-glow:#39FF9C;    /* decorative neon green, live/pulse accents only */

  --good:#0CA30C;
  --good-soft:rgba(46,196,84,0.14);
  --warn:#FAB219;
  --warn-soft:rgba(250,178,25,0.14);
  --serious:#EC835A;
  --serious-soft:rgba(236,131,90,0.14);
  --critical:#D03B3B;
  --critical-strong:#FF5C6C;
  --critical-soft:rgba(255,92,108,0.14);
  --info:#37C6E8;
  --info-soft:rgba(55,198,232,0.14);

  --cat-1:#3987E5; --cat-2:#D95926; --cat-3:#199E70; --cat-4:#C98500; --cat-5:#D55181; --cat-6:#9085E9;

  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;

  --radius-sm:6px; --radius:10px; --radius-lg:16px;
  --shadow-lg: 0 20px 60px -12px rgba(0,0,0,0.6);
  --sidebar-w: 272px;
  --sidebar-w-collapsed: 60px;
  --topbar-h: 56px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:13.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(57,135,229,0.10), transparent 45%),
    radial-gradient(circle at 85% 8%, rgba(144,133,233,0.07), transparent 40%);
  background-attachment:fixed;
}
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }
::selection{ background:var(--accent-soft); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--surface-4); border-radius:8px; border:2px solid var(--bg); }
:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; border-radius:4px; }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.tnum{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--text-muted); }
.secondary{ color:var(--text-secondary); }

/* ============================= SHELL ============================= */
#shell{ display:flex; min-height:100vh; }

/* --- sidebar --- */
#sidebar{
  width:var(--sidebar-w); flex:0 0 auto; position:fixed; top:0; left:0; bottom:0;
  background:linear-gradient(180deg, var(--surface), #0C1019 85%);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; z-index:40; transition:width .15s ease;
}
#sidebar.collapsed{ width:var(--sidebar-w-collapsed); }
.brand{ display:flex; align-items:center; gap:10px; padding:16px 16px; border-bottom:1px solid var(--border-soft); min-height:56px; }
.brand-mark{ width:30px; height:30px; flex:0 0 auto; border-radius:8px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); position:relative; box-shadow:0 0 18px rgba(57,135,229,0.45); }
.brand-mark::after{ content:''; position:absolute; inset:8px; border:1.5px solid rgba(255,255,255,0.75); border-radius:3px; }
.brand-text{ overflow:hidden; white-space:nowrap; }
.brand-title{ font-weight:700; font-size:13.5px; letter-spacing:.06em; }
.brand-sub{ font-size:10px; color:var(--text-muted); letter-spacing:.04em; margin-top:1px; }
#sidebar.collapsed .brand-text{ display:none; }

#navscroll{ flex:1 1 auto; overflow-y:auto; padding:10px 8px 16px; }
.nav-group{ margin-bottom:2px; }
.nav-group-btn{ width:100%; display:flex; align-items:center; gap:8px; padding:9px 8px; border:0; background:transparent; color:var(--text-secondary); font-size:11px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap; }
.nav-group-btn span:not(.gicon):not(.chev){ overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; text-align:left; }
.nav-group-btn:hover{ background:var(--surface-2); color:var(--text); }
.nav-group-btn .chev{ margin-left:auto; transition:transform .15s; color:var(--text-faint); }
.nav-group.open .nav-group-btn .chev{ transform:rotate(90deg); }
.nav-group-btn .gicon{ width:15px; text-align:center; flex:0 0 auto; color:var(--text-muted); }
.nav-items{ max-height:0; overflow:hidden; }
.nav-group.open .nav-items{ max-height:600px; }
.nav-item{ display:flex; align-items:center; gap:10px; padding:7px 10px 7px 33px; font-size:12.8px; color:var(--text-secondary); border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap; position:relative; }
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
.nav-item.active::before{ content:''; position:absolute; left:14px; top:50%; transform:translateY(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent-strong); }
#sidebar.collapsed .nav-label, #sidebar.collapsed .nav-group-btn span:not(.gicon):not(.chev), #sidebar.collapsed .nav-items{ display:none; }
#sidebar.collapsed .nav-item{ justify-content:center; padding-left:0 !important; }

.sidebar-foot{ border-top:1px solid var(--border-soft); padding:10px; display:flex; align-items:center; gap:8px; }
.collapse-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); width:28px; height:28px; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.collapse-btn:hover{ color:var(--text); border-color:var(--accent); }
.tenant-pill{ flex:1 1 auto; overflow:hidden; }
.tenant-name{ font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tenant-plan{ font-size:10px; color:var(--text-muted); }
#sidebar.collapsed .tenant-pill{ display:none; }

/* --- topbar + main --- */
#mainwrap{ flex:1 1 auto; margin-left:var(--sidebar-w); min-width:0; transition:margin-left .15s ease; }
#sidebar.collapsed ~ #mainwrap{ margin-left:var(--sidebar-w-collapsed); }
#topbar{
  height:var(--topbar-h); position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:0 20px; background:rgba(10,14,23,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-soft);
}
.crumb{ font-size:12px; color:var(--text-muted); white-space:nowrap; }
.search-wrap{ flex:1 1 auto; max-width:420px; position:relative; }
.search-input{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px 7px 30px; font-size:12.5px; }
.search-input::placeholder{ color:var(--text-muted); }
.search-icon{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:12px; }
.top-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }
.live-pill{ display:flex; align-items:center; gap:6px; background:var(--good-soft); color:var(--brand-glow); border:1px solid rgba(57,255,156,0.25); border-radius:20px; padding:5px 10px; font-size:10.5px; font-weight:700; letter-spacing:.06em; }
.live-dot{ width:6px; height:6px; border-radius:50%; background:var(--brand-glow); box-shadow:0 0 8px var(--brand-glow); animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
.icon-btn{ position:relative; width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; }
.icon-btn:hover{ color:var(--text); border-color:var(--accent); }
.badge-dot{ position:absolute; top:-4px; right:-4px; background:var(--critical-strong); color:#fff; font-size:9px; font-weight:700; border-radius:8px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
.env-pill{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface-2); border-radius:20px; padding:5px 10px 5px 8px; font-size:11.5px; color:var(--text-secondary); cursor:pointer; }
.avatar{ width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--accent-2),var(--accent)); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; }

#view{ padding:22px 26px 60px; max-width:1600px; }

/* ============================= PAGE HEADER ============================= */
.page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; flex-wrap:wrap; }
.page-eyebrow{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.page-title{ font-size:22px; font-weight:700; letter-spacing:-.01em; margin:0; text-wrap:balance; }
.page-desc{ color:var(--text-secondary); font-size:12.8px; margin-top:6px; max-width:680px; }
.page-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.btn{ border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:12.3px; font-weight:600; padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
.btn-primary{ background:linear-gradient(135deg,var(--accent),#2f6fc4); border-color:transparent; color:#fff; }
.btn-primary:hover{ filter:brightness(1.1); color:#fff; }
.btn-danger{ background:var(--critical-soft); border-color:rgba(255,92,108,0.35); color:#ffb3bb; }
.btn-danger:hover{ border-color:var(--critical-strong); color:#fff; }
.btn-sm{ padding:5px 10px; font-size:11.5px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

.tabstrip{ display:flex; gap:4px; border-bottom:1px solid var(--border-soft); margin:16px 0 20px; overflow-x:auto; }
.tab{ padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
.tab:hover{ color:var(--text); }
.tab.active{ color:var(--accent-strong); border-color:var(--accent-strong); }

/* ============================= LAYOUT GRID ============================= */
.grid{ display:grid; gap:14px; }
.g-kpi{ grid-template-columns:repeat(4,1fr); }
.g-2{ grid-template-columns:repeat(2,1fr); }
.g-3{ grid-template-columns:repeat(3,1fr); }
.g-4{ grid-template-columns:repeat(4,1fr); }
.g-span2{ grid-column:span 2; }
.g-span3{ grid-column:span 3; }
.g-span4{ grid-column:span 4; }
@media (max-width:1200px){ .g-kpi{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);} .g-4{grid-template-columns:repeat(2,1fr);} }
.section-gap{ margin-top:18px; }

/* ============================= CARD / PANEL ============================= */
.panel{ background:linear-gradient(180deg,var(--surface-2),var(--surface)); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:16px 18px; position:relative; overflow:hidden; }
.panel-glass{ background:linear-gradient(160deg, rgba(57,135,229,0.08), rgba(144,133,233,0.05)); border:1px solid rgba(255,255,255,0.06); backdrop-filter:blur(6px); }
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }
.panel-title{ font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; }
.panel-sub{ font-size:11.3px; color:var(--text-muted); margin-top:2px; }

.kpi-card{ background:linear-gradient(165deg,var(--surface-2),var(--surface)); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; position:relative; overflow:hidden; }
.kpi-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--stripe,var(--accent)); }
.kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700; display:flex; align-items:center; justify-content:space-between; }
.kpi-value{ font-size:26px; font-weight:700; margin-top:6px; letter-spacing:-.01em; }
.kpi-value .unit{ font-size:13px; color:var(--text-muted); font-weight:600; margin-left:2px; }
.kpi-foot{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; }
.delta{ display:inline-flex; align-items:center; gap:2px; font-weight:700; padding:1px 5px; border-radius:5px; }
.delta.bad{ color:#ffb3bb; background:var(--critical-soft); }
.delta.good{ color:#8fe0a8; background:var(--good-soft); }
.delta.flat{ color:var(--text-muted); background:var(--surface-3); }
.kpi-spark{ position:absolute; right:10px; bottom:10px; opacity:.9; }

/* ============================= CHIPS / BADGES ============================= */
.chip{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; letter-spacing:.01em; }
.chip .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
.chip-critical{ background:var(--critical-soft); color:#ff9aa5; }
.chip-critical .dot{ background:var(--critical-strong); }
.chip-high{ background:var(--serious-soft); color:#f5a67d; }
.chip-high .dot{ background:var(--serious); }
.chip-medium{ background:var(--warn-soft); color:#f9cf72; }
.chip-medium .dot{ background:var(--warn); }
.chip-low{ background:var(--good-soft); color:#7fe19c; }
.chip-low .dot{ background:var(--good); }
.chip-info{ background:var(--info-soft); color:#7fe0f2; }
.chip-info .dot{ background:var(--info); }
.chip-neutral{ background:var(--surface-3); color:var(--text-secondary); }
.chip-neutral .dot{ background:var(--text-muted); }
.chip-accent2{ background:var(--accent-2-soft); color:#c3bcf5; }
.chip-accent2 .dot{ background:var(--accent-2); }
.tag{ font-size:10.5px; background:var(--surface-3); border:1px solid var(--border); color:var(--text-secondary); padding:2px 7px; border-radius:5px; white-space:nowrap; }

/* ============================= TABLE ============================= */
.table-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius:var(--radius-lg); }
table.dtable{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }
table.dtable thead th{ text-align:left; font-size:10.6px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; padding:10px 14px; background:var(--surface-3); border-bottom:1px solid var(--border); position:sticky; top:0; white-space:nowrap; }
table.dtable tbody td{ padding:10px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
table.dtable tbody tr{ cursor:pointer; }
table.dtable tbody tr:hover{ background:var(--surface-2); }
table.dtable tbody tr:last-child td{ border-bottom:none; }
.cell-primary{ font-weight:600; color:var(--text); }
.cell-sub{ color:var(--text-muted); font-size:11px; margin-top:1px; }
.row-chevron{ color:var(--text-faint); float:right; }
.risk-bar-wrap{ display:flex; align-items:center; gap:8px; }
.risk-bar{ width:52px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; flex:0 0 auto; }
.risk-bar > i{ display:block; height:100%; border-radius:3px; }
.empty-row td{ text-align:center; color:var(--text-muted); padding:34px; }

/* filters */
.filter-bar{ display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.filter-bar select, .filter-bar input[type=text]{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:12px; border-radius:7px; padding:6px 10px; }
.filter-bar .fcount{ margin-left:auto; font-size:11.5px; color:var(--text-muted); }
.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px; }
.seg button{ border:0; background:transparent; color:var(--text-muted); font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:6px; cursor:pointer; }
.seg button.active{ background:var(--accent); color:#fff; }

/* ============================= MISC COMPONENTS ============================= */
.hairline{ height:1px; background:var(--border-soft); border:0; margin:14px 0; }
.kv{ display:grid; grid-template-columns:150px 1fr; gap:8px 12px; font-size:12.5px; }
.kv > div:nth-child(odd){ color:var(--text-muted); }
.stat-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border-soft); font-size:12.3px; }
.stat-row:last-child{ border-bottom:none; }
.progress{ height:6px; border-radius:4px; background:var(--surface-3); overflow:hidden; }
.progress > i{ display:block; height:100%; border-radius:4px; }
.scorecard{ text-align:center; padding:18px 10px; }
.scorecard .num{ font-size:34px; font-weight:800; }
.scorecard .lbl{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }

.leaderboard-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); }
.leaderboard-row:last-child{ border-bottom:none; }
.rank{ width:20px; text-align:center; font-weight:800; color:var(--text-muted); font-size:12px; }
.lb-name{ font-weight:600; font-size:12.5px; }
.lb-sub{ font-size:10.8px; color:var(--text-muted); }

.timeline{ position:relative; padding-left:22px; }
.timeline::before{ content:''; position:absolute; left:6px; top:4px; bottom:4px; width:1px; background:var(--border); }
.tl-item{ position:relative; padding-bottom:16px; }
.tl-item::before{ content:''; position:absolute; left:-22px; top:2px; width:9px; height:9px; border-radius:50%; background:var(--dot,var(--accent)); box-shadow:0 0 0 3px var(--bg); }
.tl-time{ font-size:10.5px; color:var(--text-muted); }
.tl-title{ font-weight:600; font-size:12.5px; margin-top:2px; }
.tl-desc{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; }

.evidence-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-family:var(--font-mono); padding:6px 0; border-bottom:1px dashed var(--border-soft); color:var(--text-secondary); }
.evidence-row:last-child{ border-bottom:none; }

.flow{ display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:6px 0 14px; }
.flow-step{ flex:0 0 auto; min-width:150px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; position:relative; }
.flow-step .fs-label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; }
.flow-step .fs-title{ font-size:12.5px; font-weight:700; margin-top:4px; }
.flow-step .fs-detail{ font-size:11px; color:var(--text-secondary); margin-top:4px; }
.flow-arrow{ flex:0 0 auto; width:34px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:16px; }

.drawer-backdrop{ position:fixed; inset:0; background:rgba(4,6,12,0.6); backdrop-filter:blur(2px); z-index:90; display:flex; justify-content:flex-end; }
.drawer{ width:min(480px,92vw); height:100%; background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); overflow-y:auto; padding:20px; animation:slidein .18s ease; }
@keyframes slidein{ from{ transform:translateX(24px); opacity:0 } to{ transform:none; opacity:1 } }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.drawer-close{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-secondary); border-radius:7px; width:28px; height:28px; cursor:pointer; }
.drawer input[type=text], .drawer input[type=password], .drawer input[type=number], .drawer select{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:12.5px; }
.field-label{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:700; margin-bottom:5px; }
.field-group{ margin-bottom:14px; }
.field-check{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:4px 9px; cursor:pointer; }
.field-check input{ margin:0; accent-color:var(--accent); }
.switch{ position:relative; display:inline-block; width:38px; height:21px; flex:0 0 auto; }
.switch input{ opacity:0; width:0; height:0; }
.switch .track{ position:absolute; inset:0; background:var(--surface-3); border:1px solid var(--border); border-radius:20px; transition:.15s; }
.switch .track::before{ content:''; position:absolute; width:15px; height:15px; left:2px; top:2px; background:var(--text-muted); border-radius:50%; transition:.15s; }
.switch input:checked + .track{ background:var(--good-soft); border-color:var(--good); }
.switch input:checked + .track::before{ transform:translateX(17px); background:var(--good); }

<div id="app"></div>

<script>
(function(){
"use strict";
/* ============================================================
   UTILITIES
   ============================================================ */
const CAT = ['#3987E5','#D95926','#199E70','#C98500','#D55181','#9085E9'];
const STATUS = {good:'#0CA30C', warn:'#FAB219', serious:'#EC835A', critical:'#D03B3B'};
const SEQ = ['#0d366b','#104281','#184f95','#1c5cab','#256abf','#2a78d6','#3987e5','#5598e7','#6da7ec','#86b6ef'];
const TIER_COLOR = {critical:'var(--critical-strong)', high:'var(--serious)', medium:'var(--warn)', low:'var(--good)'};
const TIER_CHIPCLASS = {critical:'chip-critical', high:'chip-high', medium:'chip-medium', low:'chip-low'};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return Number(n).toLocaleString('en-US'); }
function pct(n,d){ return d? Math.round((n/d)*100) : 0; }
function riskTier(score){ if(score>=85) return 'critical'; if(score>=70) return 'high'; if(score>=40) return 'medium'; return 'low'; }
function riskColorVar(score){ return TIER_COLOR[riskTier(score)]; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }

function chip(label, tier, opts){
  opts = opts||{};
  const cls = TIER_CHIPCLASS[tier] || (opts.cls || 'chip-neutral');
  return `<span class="chip ${cls}"><span class="dot"></span>${esc(label)}</span>`;
}
function chipRaw(label, cls){ return `<span class="chip ${cls}"><span class="dot"></span>${esc(label)}</span>`; }
function statusChip(status){
  const map = {
    active:['low','Active'], enabled:['low','Enabled'], allow:['low','Allow'], pass:['low','Passed'], approved:['low','Approved'],
    completed:['low','Completed'], resolved:['low','Resolved'], validated:['low','Validated'], trusted:['low','Trusted'], ga:['low','GA'],
    idle:['medium','Idle'], preview:['medium','Preview'], warn:['medium','Warn'], warning:['medium','Warning'], pending:['medium','Pending'],
    investigating:['medium','Investigating'], canary:['medium','Canary'], observe:['medium','Observe'], unverified:['medium','Unverified'],
    quarantined:['critical','Quarantined'], disabled:['critical','Disabled'], block:['critical','Block'], blocked:['critical','Blocked'],
    failed:['critical','Failed'], rejected:['critical','Rejected'], critical:['critical','Critical'], escalated:['critical','Escalated'],
    'false-positive':['neutral','False Positive'], flagged:['critical','Flagged'], retired:['neutral','Retired'], draft:['neutral','Draft'],
    running:['info','Running'], require_approval:['medium','Requires Approval'], approve:['medium','Approve'], degraded:['medium','Degraded']
  };
  const m = map[status] || ['neutral', status];
  if(m[0]==='neutral') return chipRaw(m[1],'chip-neutral');
  if(m[0]==='info') return chipRaw(m[1],'chip-info');
  return chip(m[1], m[0]);
}
function riskBar(score){
  return `<div class="risk-bar-wrap"><span class="mono tnum" style="font-weight:700;color:${riskColorVar(score)}">${score}</span>
    <div class="risk-bar"><i style="width:${score}%;background:${riskColorVar(score)}"></i></div></div>`;
}
function initials(name){ return name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ============================================================
   SVG CHART PRIMITIVES  (dataviz: form -> color -> validated palette -> marks -> hover)
   ============================================================ */
function sparkline(values, w, h, color){
  w=w||70; h=h||24; color=color||'var(--accent)';
  const min=Math.min(...values), max=Math.max(...values);
  const range = (max-min)||1;
  const step = w/(values.length-1);
  const pts = values.map((v,i)=> [i*step, h-2 - ((v-min)/range)*(h-6)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = `0,${h} ${line} ${w},${h}`;
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="${area}" fill="${color}" opacity="0.14"></polygon>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"></circle>
  </svg>`;
}

function lineChart(opts){
  const {labels, values, w=560, h=190, color='var(--accent)', unit='', secondValues=null, secondColor='var(--accent-2)', secondLabel=''} = opts;
  const padL=34, padR=10, padT=14, padB=24;
  const iw = w-padL-padR, ih = h-padT-padB;
  const allVals = secondValues? values.concat(secondValues) : values;
  const max = Math.max(...allVals)*1.15, min = 0;
  const stepX = iw/(labels.length-1);
  const xy = (v,i)=>[padL+i*stepX, padT+ih - ((v-min)/(max-min))*ih];
  const mkLine = (arr)=> arr.map((v,i)=>xy(v,i));
  const toPoly = pts => pts.map(p=>p.join(',')).join(' ');
  const gridY = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + ih - f*ih;
    const val = Math.round(min + f*(max-min));
    return `<line x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"></line>
      <text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9.5" fill="var(--text-muted)">${val}</text>`;
  }).join('');
  const p1 = mkLine(values);
  const area1 = `${padL},${padT+ih} ${toPoly(p1)} ${padL+iw},${padT+ih}`;
  const last1 = p1[p1.length-1];
  let series2 = '';
  if(secondValues){
    const p2 = mkLine(secondValues);
    const last2 = p2[p2.length-1];
    series2 = `<polyline points="${toPoly(p2)}" fill="none" stroke="${secondColor}" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"></polyline>
      <circle cx="${last2[0]}" cy="${last2[1]}" r="3.5" fill="${secondColor}"></circle>`;
  }
  const xLabels = labels.map((l,i)=> i%Math.ceil(labels.length/7)===0 ? `<text x="${padL+i*stepX}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">${esc(l)}</text>` : '').join('');
  const legend = secondValues ? `<div style="display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--text-secondary)">
      <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:2px;background:${color};display:inline-block"></i>${esc(opts.mainLabel||'Series')}</span>
      <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:2px;background:${secondColor};display:inline-block;border-top:2px dashed ${secondColor}"></i>${esc(secondLabel)}</span>
    </div>` : '';
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="max-width:100%;height:${h}px">
    ${gridY}
    <polygon points="${area1}" fill="${color}" opacity="0.13"></polygon>
    <polyline points="${toPoly(p1)}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <circle cx="${last1[0]}" cy="${last1[1]}" r="3.5" fill="${color}"></circle>
    ${series2}
    ${xLabels}
  </svg>${legend}`;
}

function donutChart(data, size){
  size = size||160;
  const total = data.reduce((s,d)=>s+d.value,0)||1;
  const r = size/2-14, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
  let offset = 0;
  const segs = data.map(d=>{
    const frac = d.value/total;
    const len = frac*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="16"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"></circle>`;
    offset += len + 1.5;
    return seg;
  }).join('');
  const legend = `<div style="display:flex;flex-direction:column;gap:7px;margin-top:2px">` + data.map(d=>
    `<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-secondary)">
      <span style="width:9px;height:9px;border-radius:3px;background:${d.color};flex:0 0 auto"></span>
      <span style="flex:1 1 auto">${esc(d.label)}</span>
      <span class="mono tnum" style="color:var(--text)">${d.value}</span>
      <span class="muted" style="width:38px;text-align:right">${pct(d.value,total)}%</span>
    </div>`).join('') + `</div>`;
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="16"></circle>
      ${segs}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text)">${fmtNum(total)}</text>
      <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">TOTAL</text>
    </svg>
    <div style="flex:1 1 160px;min-width:150px">${legend}</div>
  </div>`;
}

function barChart(data, opts){
  opts = opts||{};
  const w = opts.w||520, rowH = opts.rowH||26, gap=8;
  const max = opts.max || Math.max(...data.map(d=>d.value))*1.1;
  const labelW = opts.labelW||130;
  const barW = w-labelW-46;
  const h = data.length*(rowH+gap);
  const rows = data.map((d,i)=>{
    const y = i*(rowH+gap);
    const bw = clamp((d.value/max)*barW,2,barW);
    const color = d.color || 'var(--accent)';
    return `<g>
      <text x="${labelW-8}" y="${y+rowH/2+4}" text-anchor="end" font-size="11.2" fill="var(--text-secondary)">${esc(d.label)}</text>
      <rect x="${labelW}" y="${y+3}" width="${barW}" height="${rowH-6}" rx="4" fill="var(--surface-3)"></rect>
      <rect x="${labelW}" y="${y+3}" width="${bw}" height="${rowH-6}" rx="4" fill="${color}"></rect>
      <text x="${labelW+bw+8}" y="${y+rowH/2+4}" font-size="11.5" font-weight="700" fill="var(--text)" class="tnum">${fmtNum(d.value)}${d.suffix||''}</text>
    </g>`;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:100%">${rows}</svg>`;
}

function heatmap(rowLabels, colLabels, matrix, opts){
  opts = opts||{};
  const cell = opts.cell||26, labelW=opts.labelW||96, gap=3;
  const maxV = Math.max(...matrix.flat());
  const colorFor = v=>{
    const idx = Math.round((v/ (maxV||1)) * (SEQ.length-1));
    return SEQ[clamp(idx,0,SEQ.length-1)];
  };
  const w = labelW + colLabels.length*(cell+gap);
  const h = 20 + rowLabels.length*(cell+gap);
  let out = `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:100%">`;
  colLabels.forEach((c,ci)=>{
    out += `<text x="${labelW+ci*(cell+gap)+cell/2}" y="12" text-anchor="middle" font-size="9" fill="var(--text-muted)">${esc(c)}</text>`;
  });
  rowLabels.forEach((r,ri)=>{
    const y = 18+ri*(cell+gap);
    out += `<text x="${labelW-8}" y="${y+cell/2+3}" text-anchor="end" font-size="10.4" fill="var(--text-secondary)">${esc(r)}</text>`;
    colLabels.forEach((c,ci)=>{
      const v = matrix[ri][ci];
      const x = labelW+ci*(cell+gap);
      out += `<rect class="heat-cell" x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${colorFor(v)}">
        <title>${esc(r)} × ${esc(c)}: ${v}</title></rect>`;
    });
  });
  out += `</svg>`;
  return `<div class="heat-wrap">${out}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10px;color:var(--text-muted)">
      Fewer calls ${SEQ.map(c=>`<span style="width:14px;height:8px;background:${c};display:inline-block;border-radius:2px"></span>`).join('')} More calls
    </div>`;
}

function gaugeArc(value, size, label){
  size = size||150;
  const r = size/2-12, cx=size/2, cy=size/2+6;
  const startA = Math.PI, endA = 0;
  const frac = clamp(value,0,100)/100;
  const color = riskColorVar(value);
  function arcPath(a0,a1){
    const x0 = cx+r*Math.cos(a0), y0 = cy - r*Math.sin(a0);
    const x1 = cx+r*Math.cos(a1), y1 = cy - r*Math.sin(a1);
    return `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1}`;
  }
  const valueAngle = Math.PI - frac*Math.PI;
  return `<div class="gauge-wrap">
  <svg width="${size}" height="${size*0.62}" viewBox="0 0 ${size} ${size*0.62}">
    <path d="${arcPath(Math.PI,0)}" fill="none" stroke="var(--surface-3)" stroke-width="12" stroke-linecap="round"></path>
    <path d="${arcPath(Math.PI,valueAngle)}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"></path>
  </svg>
  <div class="gauge-num" style="color:${color}">${value}</div>
  <div class="gauge-lbl">${esc(label||'Risk Score')} / 100</div>
  </div>`;
}

/* ---- world dot map ---- */
const LANDMASS_BOXES = [
  [-125,-108,24,49],[-108,-95,25,49],[-95,-80,25,49],[-80,-65,25,47],[-160,-140,55,68],[-108,60,60,72],
  [-72,-35,-55,5],[-80,-35,5,12],
  [-10,2,35,42],[2,15,36,47],[-9,-1,36,44],[15,30,36,47],[10,40,30,37],
  [-17,20,5,35],[20,45,5,32],[10,30,-35,5],[30,42,-30,5],
  [26,48,12,42],[48,63,12,32],[63,100,8,38],[100,120,5,25],[120,146,20,46],[95,105,-8,20],
  [110,155,-45,-10],[140,178,-38,-10],
  [30,60,50,66],[60,90,50,66],[90,140,50,66],[20,40,45,60]
];
function worldDots(step){
  step = step||4; const dots=[];
  for(let lon=-179; lon<=179; lon+=step){
    for(let lat=-58; lat<=72; lat+=step){
      if(LANDMASS_BOXES.some(b=> lon>=b[0]&&lon<=b[1]&&lat>=b[2]&&lat<=b[3])) dots.push([lon,lat]);
    }
  }
  return dots;
}
const WORLD_DOTS = worldDots(3.2);
function project(lon,lat,w,h){ return [ (lon+180)/360*w, (90-lat)/180*h ]; }
function worldMap(points, w, h){
  w=w||760; h=h||300;
  const dots = WORLD_DOTS.map(([lo,la])=>{ const [x,y]=project(lo,la,w,h); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.15" class="world-dot"></circle>`; }).join('');
  const marks = points.map(p=>{
    const [x,y] = project(p.lon,p.lat,w,h);
    const color = TIER_COLOR[p.tier]||'var(--accent)';
    const pulse = p.tier==='critical'||p.tier==='high' ? `<circle cx="${x}" cy="${y}" r="9" fill="${color}" opacity="0.18"><animate attributeName="r" values="6;13;6" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.2s" repeatCount="indefinite"/></circle>` : '';
    return `<g>${pulse}<circle cx="${x}" cy="${y}" r="4" fill="${color}" stroke="var(--bg)" stroke-width="1.5"><title>${esc(p.city)} · ${esc(p.label||'')}</title></circle></g>`;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:100%">${dots}${marks}</svg>`;
}

/* ============================================================
   LAYERED NODE-LINK GRAPH ENGINE
   (AI System Graph, MCP graph, Identity graph, Attack Path explorer)
   ============================================================ */
const TYPE_COLOR = {agent:'var(--accent-2)', tool:'var(--accent)', mcp:'var(--info)', data:'#C98500', identity:'var(--good)', human:'var(--text-secondary)', resource:'var(--serious)', threat:'var(--critical-strong)', role:'var(--accent)', permission:'var(--warn)'};
const TYPE_LABEL = {agent:'Agent', tool:'Tool', mcp:'MCP Server', data:'Data / KB', identity:'Identity', human:'Human Owner', resource:'Resource', threat:'Threat Actor', role:'Role', permission:'Permission'};

function layeredGraphSVG(cfg, idPrefix){
  idPrefix = idPrefix||'g'+Math.random().toString(36).slice(2,6);
  const cols = cfg.columns;
  const W = Math.max(1000, cols.length*190);
  const nodeW = cfg.nodeW||158, nodeH=cfg.nodeH||48;
  const colXs = cols.map((c,i)=> cols.length===1 ? W/2 : 90 + i*((W-180)/(cols.length-1)) );
  const rowsMax = Math.max(...cols.map(c=>c.nodes.length),1);
  const H = Math.max(cfg.minH||420, rowsMax*(nodeH+34)+70);
  const pos = {};
  let colLabels = '';
  cols.forEach((c,ci)=>{
    const x = colXs[ci];
    const n = c.nodes.length;
    const totalH = n*nodeH + (n-1)*30;
    const startY = (H-totalH)/2;
    colLabels += `<text x="${x}" y="26" text-anchor="middle" font-size="10.5" letter-spacing="0.05em" fill="var(--text-muted)" font-weight="700">${esc(c.label.toUpperCase())}</text>`;
    c.nodes.forEach((node,ni)=>{
      const y = startY + ni*(nodeH+30);
      pos[node.id] = {x, y: y+nodeH/2, top:y, node};
    });
  });
  const highlight = new Set(cfg.highlightIds||[]);
  const edgesSvg = (cfg.edges||[]).map(e=>{
    const a = pos[e.from], b = pos[e.to];
    if(!a||!b) return '';
    const isHi = highlight.has(e.from) && highlight.has(e.to);
    const x1=a.x+nodeW/2, y1=a.y, x2=b.x-nodeW/2, y2=b.y;
    const midx = (x1+x2)/2;
    const stroke = isHi ? 'var(--critical-strong)' : (e.color||'var(--text-faint)');
    const width = isHi ? 2.6 : 1.4;
    const dash = isHi ? `stroke-dasharray="7 5" class="atk-edge"` : '';
    return `<path d="M ${x1} ${y1} C ${midx} ${y1} ${midx} ${y2} ${x2} ${y2}" fill="none" stroke="${stroke}" stroke-width="${width}" ${dash} marker-end="url(#${idPrefix}-arrow${isHi?'-hi':''})" opacity="${isHi?1:0.7}"></path>`;
  }).join('');
  const nodesSvg = Object.values(pos).map(p=>{
    const n = p.node;
    const color = TYPE_COLOR[n.type]||'var(--accent)';
    const isHi = highlight.has(n.id);
    const x = p.x-nodeW/2, y=p.top;
    return `<g class="gnode" data-tip="${esc(n.label)} · ${esc(TYPE_LABEL[n.type]||n.type)}${n.sub? ' · '+esc(n.sub):''}" style="cursor:pointer">
      <rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="9" fill="var(--surface-2)" stroke="${isHi?'var(--critical-strong)':color}" stroke-width="${isHi?2.4:1.4}"></rect>
      <rect x="${x}" y="${y}" width="4" height="${nodeH}" rx="2" fill="${color}"></rect>
      <text x="${x+14}" y="${y+19}" font-size="11.3" font-weight="700" fill="var(--text)">${esc(trunc(n.label,17))}</text>
      <text x="${x+14}" y="${y+33}" font-size="9.6" fill="var(--text-muted)">${esc(trunc(n.sub||TYPE_LABEL[n.type]||'',20))}</text>
    </g>`;
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="min-width:${W}px">
    <defs>
      <marker id="${idPrefix}-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="var(--text-faint)"></polygon></marker>
      <marker id="${idPrefix}-arrow-hi" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><polygon points="0,0 7,3 0,6" fill="var(--critical-strong)"></polygon></marker>
    </defs>
    ${colLabels}
    ${edgesSvg}
    ${nodesSvg}
  </svg>`;
}
function trunc(s,n){ s=String(s); return s.length>n? s.slice(0,n-1)+'…' : s; }

function graphShell(opts){
  opts = opts||{};
  const legend = (opts.legend||[]).map(l=> `<div class="legend-row"><span class="legend-swatch" style="background:${l.color}"></span>${esc(l.label)}</div>`).join('');
  return `<div class="graph-toolbar">
      ${opts.toolbarLeft||''}
      <span class="fcount" id="${opts.id}-count"></span>
    </div>
    <div class="graph-stage ${opts.tall?'tall':''}" id="${opts.id}-stage">
      <div class="graph-pan" id="${opts.id}-pan" style="transform:translate(0px,0px) scale(1)">${opts.content||''}</div>
      <div class="graph-legend">${legend}</div>
      <div class="zoom-controls">
        <button onclick="App.graphZoom('${opts.id}',0.2)" aria-label="Zoom in">+</button>
        <button onclick="App.graphZoom('${opts.id}',-0.2)" aria-label="Zoom out">–</button>
        <button onclick="App.graphReset('${opts.id}')" aria-label="Reset view">⤾</button>
      </div>
      <div class="node-tip" id="${opts.id}-tip"></div>
    </div>`;
}

const ROUTES = [];
function registerRoute(pattern, render, crumb, mount){ ROUTES.push({pattern, render, crumb, mount}); }
function matchRoute(hash){
  const path = (hash||'').replace(/^#\/?/, '');
  const segs = path.split('/').filter(Boolean);
  for(const r of ROUTES){
    const rsegs = r.pattern.split('/').filter(Boolean);
    if(rsegs.length!==segs.length) continue;
    let ok=true; const params={};
    for(let i=0;i<rsegs.length;i++){
      if(rsegs[i][0]===':') params[rsegs[i].slice(1)]=decodeURIComponent(segs[i]);
      else if(rsegs[i]!==segs[i]){ ok=false; break; }
    }
    if(ok) return {route:r, params};
  }
  return null;
}

const App = {
  state:{ collapsed:false, openGroups:{}, filters:{}, graphView:{}, drawer:null },

  nav(route){ if(location.hash===route){ this.render(); } else { location.hash = route; } },
  toggleSidebar(){ this.state.collapsed = !this.state.collapsed; document.getElementById('sidebar').classList.toggle('collapsed', this.state.collapsed); },
  toggleGroup(id){ this.state.openGroups[id] = !this.state.openGroups[id]; this.renderSidebar(); },

  setFilter(pageKey, field, value){ const f = this.state.filters[pageKey] || (this.state.filters[pageKey]={}); f[field]=value; this.render(); },
  resetFilters(pageKey){ this.state.filters[pageKey] = {}; this.render(); },

  openDrawer(html){ this.state.drawer = html; this.renderDrawer(); },
  // Inline onclick="..." attributes only ever resolve against the global scope, never this
  // IIFE's closure — so drawer-content builders (containmentDrawer, approvalContextDrawer,
  // connectorConfigDrawer) can't be called bare from markup. Route through these App methods
  // instead, since `App` itself is attached to window.
  openContainmentDrawer(agentId){ this.openDrawer(containmentDrawer(agentId)); },
  openApprovalDrawer(id){ this.openDrawer(approvalContextDrawer(id)); },
  openConnectorDrawer(connId){ this.openDrawer(connectorConfigDrawer(connId)); },
  closeDrawer(){ this.state.drawer = null; this.renderDrawer(); },
  renderDrawer(){
    const el = document.getElementById('drawer-root');
    if(!this.state.drawer){ el.innerHTML=''; return; }
    el.innerHTML = `<div class="drawer-backdrop" onclick="if(event.target===this) App.closeDrawer()">
      <div class="drawer">${this.state.drawer}</div></div>`;
  },

  setApproval(id, status){
    const a = APPROVALS.find(x=>x.id===id); if(!a) return;
    a.status = status; a.context = (status==='approved'?'Approved just now by Priya Nair (demo action).': status==='rejected'?'Rejected just now by Priya Nair (demo action).':'Escalated just now to SecOps lead (demo action).');
    this.render();
  },

  graphZoom(id, delta){
    const v = this.state.graphView[id] || (this.state.graphView[id]={scale:1,tx:0,ty:0});
    v.scale = clamp(v.scale+delta, 0.5, 2.4);
    this.applyGraphTransform(id);
  },
  graphReset(id){ this.state.graphView[id] = {scale:1,tx:0,ty:0}; this.applyGraphTransform(id); },
  applyGraphTransform(id){
    const v = this.state.graphView[id]; const pan = document.getElementById(id+'-pan');
    if(pan && v) pan.style.transform = `translate(${v.tx}px,${v.ty}px) scale(${v.scale})`;
  },
  wireGraph(id){
    const stage = document.getElementById(id+'-stage'); if(!stage) return;
    if(!this.state.graphView[id]) this.state.graphView[id] = {scale:1,tx:0,ty:0};
    this.applyGraphTransform(id);
    const tip = document.getElementById(id+'-tip');
    let dragging=false, sx=0, sy=0, startTx=0, startTy=0;
    stage.onmousedown = (e)=>{ dragging=true; sx=e.clientX; sy=e.clientY; const v=App.state.graphView[id]; startTx=v.tx; startTy=v.ty; stage.style.cursor='grabbing'; };
    window.addEventListener('mousemove', (e)=>{
      if(dragging){ const v=App.state.graphView[id]; v.tx = startTx+(e.clientX-sx); v.ty = startTy+(e.clientY-sy); App.applyGraphTransform(id); }
    });
    window.addEventListener('mouseup', ()=>{ dragging=false; if(stage) stage.style.cursor='grab'; });
    stage.onwheel = (e)=>{ e.preventDefault(); App.graphZoom(id, e.deltaY<0?0.15:-0.15); };
    stage.onmousemove = (e)=>{
      const t = e.target.closest('.gnode');
      if(t && tip){ tip.style.display='block'; tip.style.left=(e.clientX - stage.getBoundingClientRect().left + 14)+'px'; tip.style.top=(e.clientY - stage.getBoundingClientRect().top + 10)+'px'; tip.textContent = t.getAttribute('data-tip'); }
      else if(tip){ tip.style.display='none'; }
    };
    stage.onmouseleave = ()=>{ if(tip) tip.style.display='none'; };
  },

  renderSidebar(){
    const activePath = (location.hash||'#/overview').replace(/^#\/?/,'');
    const html = NAV.map(sec=>{
      if(sec.route){
        const active = ('#/'+activePath).startsWith(sec.route) || (activePath===''&&sec.route==='#/overview');

        </div>`;
      }
      const isOpen = sec.id in this.state.openGroups ? this.state.openGroups[sec.id] : sec.items.some(([,r])=> ('#/'+activePath).startsWith(r));
      if(!(sec.id in this.state.openGroups)) this.state.openGroups[sec.id]=isOpen;
      return `<div class="nav-group ${this.state.openGroups[sec.id]?'open':''}">
        <button class="nav-group-btn" onclick="App.toggleGroup('${sec.id}')"><span class="gicon">${sec.icon}</span><span>${esc(sec.label)}</span><span class="chev">›</span></button>

/* ---- generic filterable list page ---- */
function listPage(cfg){
  const st = App.state.filters[cfg.key] || (App.state.filters[cfg.key]={});
  let rows = cfg.rows.slice();
  if(st.q){ const q=st.q.toLowerCase(); rows = rows.filter(r=> (cfg.searchKeys||[]).some(k=> String(r[k]||'').toLowerCase().includes(q))); }
  (cfg.filters||[]).forEach(f=>{
    const v = st[f.key];
    if(v){ rows = rows.filter(r=> f.match ? f.match(r,v) : String(r[f.key])===v); }
  });
  const filterCtrls = (cfg.filters||[]).map(f=>{
    const opts = f.options.map(o=>`<option value="${esc(o.value)}" ${st[f.key]===o.value?'selected':''}>${esc(o.label)}</option>`).join('');
    return `<select onchange="App.setFilter('${cfg.key}','${f.key}',this.value)"><option value="">${esc(f.label)}: All</option>${opts}</select>`;
  }).join('');
  const rowsHtml = rows.length ? rows.map(r=>{
    const dest = cfg.detailRoute ? cfg.detailRoute(r) : null;
    return `<tr ${dest?`onclick="App.nav('${dest}')"`:''}>${cfg.columns.map(c=>`<td>${c.render(r)}</td>`).join('')}${dest?'<td style="width:20px"><span class="row-chevron">›</span></td>':''}</tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="${cfg.columns.length+1}">No results match the current filters.</td></tr>`;
  return `${pageHeader(cfg)}
    <div class="filter-bar">
      <input type="text" placeholder="Search…" value="${esc(st.q||'')}" oninput="App.setFilter('${cfg.key}','q',this.value)">
      ${filterCtrls}
      <span class="fcount">${rows.length} of ${cfg.rows.length}</span>
    </div>
    <div class="table-wrap"><table class="dtable">
      <thead><tr>${cfg.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}${cfg.detailRoute?'<th></th>':''}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>`;
}

function tabPage(cfg){
  return pageHeader(cfg) + (cfg.body||'');
}

function optionsFromSet(rows, field, labelFn){
  const set = Array.from(new Set(rows.map(r=>r[field]))).sort();
  return set.map(v=>({value:v, label: labelFn?labelFn(v):v}));
}

function buildAgentGraphCfg(agent){
  const rel = relOf(agent.id);
  const cols = [
    {label:'Tools', nodes: rel.tools.map(id=>({id, label:TOOL_BY_ID[id].name, sub:TOOL_BY_ID[id].category, type:'tool'}))},
    {label:'Agent', nodes:[{id:agent.id, label:agent.name, sub:agent.framework, type:'agent'}]},
    {label:'MCP & Data', nodes:[
      ...rel.mcp.map(id=>({id, label:MCP_BY_ID[id].name, sub:'MCP Server', type:'mcp'})),
      ...rel.data.map(id=>({id, label:DATA_BY_ID[id].name, sub:DATA_BY_ID[id].kind, type:'data'})),
    ]},
    {label:'Identities & Peers', nodes:[
      ...rel.identities.map(id=>({id, label:IDENTITY_BY_ID[id].name, sub:IDENTITY_BY_ID[id].kind, type:'identity'})),
      ...rel.peers.map(id=>({id, label:AGENT_BY_ID[id].name, sub:'Peer Agent', type:'agent'})),
    ]},
    {label:'Human Owner', nodes:[{id:'human-'+agent.id, label:agent.owner, sub:agent.team, type:'human'}]},
  ].filter(c=>c.nodes.length);
  const edges = [];
  rel.tools.forEach(t=> edges.push({from:t, to:agent.id}));
  rel.mcp.forEach(m=> edges.push({from:agent.id, to:m}));
  rel.data.forEach(d=> edges.push({from:agent.id, to:d}));
  rel.identities.forEach(i=> edges.push({from:agent.id, to:i}));
  rel.peers.forEach(p=> edges.push({from:agent.id, to:p}));
  if(rel.identities.length) rel.identities.forEach(i=> edges.push({from:i, to:'human-'+agent.id}));
  else edges.push({from:agent.id, to:'human-'+agent.id});
  return {columns:cols, edges};
}

function buildAgentTimeline(agent){
  const items = [];
  DETECTIONS.filter(d=>d.agentId===agent.id).forEach(d=> items.push({time:d.lastSeen, title:'Detection: '+d.title, desc:chip(d.impact,d.impact)+' · '+esc(d.status), dot:TIER_COLOR[d.impact]}));
  EXPOSURES.filter(e=>e.agentId===agent.id).forEach(e=> items.push({time:e.discovered, title:'Exposure identified: '+e.title, desc:esc(e.type)+' · '+statusChip(e.status), dot:'var(--serious)'}));
  APPROVALS.filter(a=>a.agentId===agent.id).forEach(a=> items.push({time:a.requestedAt, title:(a.status==='pending'?'Approval requested':'Approval '+a.status)+': '+a.action, desc:statusChip(a.status), dot: a.status==='pending'?'var(--warn)':a.status==='rejected'?'var(--critical-strong)':'var(--good)'}));
  items.push({time:agent.deployed, title:'Agent deployed', desc:`v${agent.version} · ${esc(agent.runtime)} · ${esc(agent.env)}`, dot:'var(--accent)'});
  const rel = relOf(agent.id);
  rel.tools.slice(0,2).forEach(t=> items.push({time:agent.deployed, title:'Tool access granted: '+TOOL_BY_ID[t].name, desc:'Bound at deployment · '+esc(TOOL_BY_ID[t].category), dot:'var(--accent-2)'}));
  return items;
}

/* ============================================================
   AGENT-TO-AGENT MESSAGES (derived from peer relations)
   ============================================================ */
function genAgentMessages(){
  const seen = new Set(); const out=[]; let n=0;
  AGENTS.forEach(a=>{ relOf(a.id).peers.forEach(p=>{
    const key = [a.id,p].sort().join('-');
    if(seen.has(key)) return; seen.add(key); n++;
    const flagged = (a.id==='a23'&&p==='a9') || (a.id==='a9'&&p==='a23');
    out.push({id:'msg'+n, from:a.id, to:p, time:`${randInt(1,58)}m ago`,
      summary: flagged ? 'Payload includes a high-entropy token-like string flagged by DET-1049 (Cross-Agent Message Contains Credential-like Token).' : pick([
        'Shared incident context and current remediation step.',
        'Requested delegated access to complete a sub-task.',
        'Passed structured result back to requesting agent.',
        'Synced retrieved knowledge-base context for cross-check.',
        'Notified peer of a blocked action needing escalation.',
      ]), flagged });
  }); });
  return out;
}
const AGENT_MESSAGES = genAgentMessages();

function genAccessTrails(){
  const out=[]; let n=0;
  AGENTS.forEach(a=>relOf(a.id).data.forEach(d=>{ n++; out.push({id:'trail'+n, agentId:a.id, dataId:d, action:pick(['read','write']), time:`${randInt(1,180)}m ago`}); }));
  return out;
}

  return `<div class="table-wrap"><table class="dtable">

      <td>${statusChip(r.trustLabel)}</td><td>${esc(r.owner)}</td><td>${r.sizeGb} GB</td><td class="mono">${esc(r.lastIndexed)}</td>

}

        {label:'Consuming Agents', nodes: Array.from(new Set(DATA_ASSETS.filter(d=>d.kind==='RAG Source').flatMap(d=>AGENTS.filter(a=>relOf(a.id).data.includes(d.id)).map(a=>a.id)))).map(id=>({id,label:AGENT_BY_ID[id].name,sub:AGENT_BY_ID[id].framework,type:'agent'})) },

      ${graphShell({id:'ragfineage', content:layeredGraphSVG(cfg,'ragfineage'), legend:[{label:'External / Threat',color:'var(--critical-strong)'},{label:'Data / RAG Source',color:'#C98500'},{label:'Agent',color:'var(--accent-2)'}]})}

function App_createPolicy(){
  const name = document.getElementById('np-name').value || 'Untitled Policy';
  const mode = App.state.filters.newpolicy && App.state.filters.newpolicy.mode || 'Observe';
  const f1=document.getElementById('np-f1').value, o1=document.getElementById('np-o1').value, v1=document.getElementById('np-v1').value;
  const f2=document.getElementById('np-f2').value, o2=document.getElementById('np-o2').value, v2=document.getElementById('np-v2').value;
  const action = document.getElementById('np-action').value;
  const id = 'POL-'+String(POLICIES.length+1).padStart(2,'0');
  POLICIES.unshift({id, name, conditions:[[f1,o1,v1],[f2,o2,v2]], action, mode, scope:'Production', enabled:true, lastEvaluated:'Never (new)', matches:0});
  App.state.filters.newpolicy = {};
  App.nav('#/governance/policies/'+id);
}

    const bars = OWASP_COVERAGE.map(o=>({label:o.name, value:o.coverage, suffix:'%', color: o.coverage>=75?'#199E70':o.coverage>=55?'#C98500':'var(--critical-strong)'}));
    body = panel('OWASP Agentic Top 10 — Coverage','',barChart(bars,{rowH:26,labelW:250,max:100}));
  } else if(tab==='atlas'){
    const bars = ATLAS_COVERAGE.map(a=>({label:a.name, value:a.coverage, suffix:'%', color: a.coverage>=75?'#199E70':a.coverage>=55?'#C98500':'var(--critical-strong)'}));
    body = panel('MITRE ATLAS — Detection Coverage by Technique','',barChart(bars,{rowH:26,labelW:250,max:100}));
  } else {
    const gapRows = ['Govern','Map','Measure','Manage'];
    const gapCols = OWASP_COVERAGE.map(o=>o.id.replace('Agentic',''));
    const gapMatrix = NIST_RMF.map(f=> OWASP_COVERAGE.map(o=> Math.round((f.score+o.coverage)/2/10)));
    body = `${scorecardTrendPanel()}
      <div class="grid g-2 section-gap">
        ${panel('EU AI Act Readiness','',gaugeArc(EU_AI_ACT_READY,150,'Readiness'))}
        ${panel('ISO 42001 Readiness','',gaugeArc(ISO_42001_READY,150,'Readiness'))}
      </div>
      <div class="panel section-gap"><div class="panel-head"><div class="panel-title">Gap Analysis</div><div class="panel-sub">NIST function readiness vs. OWASP Agentic category coverage</div></div>${heatmap(gapRows,gapCols,gapMatrix)}</div>`;
  }
  return head+body;
}

/* ---- Connector configuration drawer ---- */
function renderConnField(connId, f){
  const val = CONNECTOR_CONFIGS[connId][f.key];
  const fid = 'cf-'+connId+'-'+f.key;
  let control = '';
  if(f.type==='text'){
    control = `<input id="${fid}" type="text" data-cfg-field="${f.key}" value="${esc(val)}">`;
  } else if(f.type==='number'){
    control = `<input id="${fid}" type="number" data-cfg-field="${f.key}" value="${esc(val)}">${f.suffix?` <span class="muted" style="font-size:11px">${esc(f.suffix)}</span>`:''}`;
  } else if(f.type==='secret'){
    control = `<input id="${fid}" type="password" data-cfg-field="${f.key}" value="${esc(val)}" placeholder="••••••••••••">`;
  } else if(f.type==='select'){
    control = `<select id="${fid}" data-cfg-field="${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  } else if(f.type==='toggle'){
    const checked = val==='On';
    control = `<label class="switch"><input type="checkbox" data-cfg-field="${f.key}" ${checked?'checked':''}><span class="track"></span></label>
      <span class="muted" style="font-size:11.5px;margin-left:8px;vertical-align:middle">${checked?'Enabled':'Disabled'}</span>`;
  } else if(f.type==='checkboxGroup'){
    control = `<div style="display:flex;flex-wrap:wrap;gap:6px">${f.options.map(o=>{
      const checked = (val||[]).includes(o);
      return `<label class="field-check"><input type="checkbox" data-cfg-field="${f.key}" data-cfg-opt="${esc(o)}" ${checked?'checked':''}>${esc(o)}</label>`;
    }).join('')}</div>`;
  }
  return `<div class="field-group"><label class="field-label">${esc(f.label)}</label>${control}${f.hint?`<div class="cell-sub" style="margin-top:4px">${esc(f.hint)}</div>`:''}</div>`;
}

function connectorConfigDrawer(connId, note){
  const c = CONNECTORS.find(x=>x.id===connId);
  const schema = (CONNECTOR_SCHEMAS[connId]||{fields:[]}).fields;
  const isDisabled = c.status==='disabled';
  return `<div class="drawer-head">
      <div><div style="font-weight:700;font-size:14px">${esc(c.name)}</div><div class="panel-sub" style="margin-top:2px">${esc(c.kind)}</div></div>
      <button class="drawer-close" onclick="App.closeDrawer()">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">${statusChip(c.status)}<span class="muted" style="font-size:11.5px">Last sync ${esc(c.lastSync)}</span></div>
    ${note?`<div class="conn-banner ok">✓ ${esc(note)}</div>`:''}
    ${(c.status==='degraded'&&!note)?`<div class="conn-banner warn">⚠ Registry endpoint returned HTTP 503 twice in the last hour — check network egress and auth token expiry.</div>`:''}
    <div id="connform-${connId}">${schema.map(f=>renderConnField(connId,f)).join('')}</div>
    <hr class="hairline">
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="App.testConnector('${connId}')">Test Connection</button>
      <button class="btn btn-primary" style="flex:1" onclick="App.saveConnectorConfig('${connId}')">Save Changes</button>
    </div>
    <button class="btn ${isDisabled?'':'btn-danger'}" style="width:100%;margin-top:8px" onclick="App.disconnectConnector('${connId}')">${isDisabled?'Reconnect Connector':'Disconnect Connector'}</button>
    <div class="fade-note">Demo action — no live system is affected.</div>`;
}

function App_saveConnectorConfig(connId){
  const root = document.getElementById('connform-'+connId);
  const schema = (CONNECTOR_SCHEMAS[connId]||{fields:[]}).fields;
  const cfg = CONNECTOR_CONFIGS[connId];
  schema.forEach(f=>{
    if(f.type==='checkboxGroup'){
      const boxes = root.querySelectorAll(`input[data-cfg-field="${f.key}"]`);
      cfg[f.key] = Array.from(boxes).filter(b=>b.checked).map(b=>b.getAttribute('data-cfg-opt'));
    } else if(f.type==='toggle'){
      const box = root.querySelector(`input[data-cfg-field="${f.key}"]`);
      cfg[f.key] = (box && box.checked) ? 'On' : 'Off';
    } else {
      const el = root.querySelector(`[data-cfg-field="${f.key}"]`);
      if(el) cfg[f.key] = el.value;
    }
  });
  const c = CONNECTORS.find(x=>x.id===connId);
  c.status = 'active'; c.lastSync = 'Just now';
  App.openDrawer(connectorConfigDrawer(connId, 'Configuration saved.'));
  App.render();
}
App.saveConnectorConfig = App_saveConnectorConfig;

function App_testConnector(connId){
  const c = CONNECTORS.find(x=>x.id===connId);
  c.status = 'active'; c.lastSync = 'Just now';
  App.openDrawer(connectorConfigDrawer(connId, 'Connection test succeeded.'));
  App.render();
}
App.testConnector = App_testConnector;

function App_disconnectConnector(connId){
  const c = CONNECTORS.find(x=>x.id===connId);
  c.status = (c.status==='disabled') ? 'active' : 'disabled';
  c.lastSync = 'Just now';
  App.openDrawer(connectorConfigDrawer(connId));
  App.render();
}
App.disconnectConnector = App_disconnectConnector;
